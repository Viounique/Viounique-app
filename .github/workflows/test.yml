name: Run All Automated Security & Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run logic unit test
        run: node test.js

      - name: Run authorization security test
        run: node auth.test.js

      - name: Run input validation security test
        run: node input.test.js

      - name: Run API security test
        run: node api.test.js

      - name: Run Dependency Audit
        run: npm audit --audit-level=high
